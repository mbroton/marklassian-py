name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --frozen --python "${{ matrix.python-version }}" pytest

      - name: Check Python 3.10 wheel import
        if: matrix.python-version == '3.10'
        run: |
          uv build --wheel
          uv venv /tmp/marklassian-python-310-wheel --python "3.10"
          uv pip install --python /tmp/marklassian-python-310-wheel/bin/python dist/*.whl
          /tmp/marklassian-python-310-wheel/bin/python -c "import marklassian"

  quality:
    name: Quality and package checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen --python "3.14"

      - name: Check lint
        run: uv run --frozen ruff check .

      - name: Check types
        run: uv run --frozen mypy src

      - name: Audit dependencies
        run: uv run --frozen pip-audit

      - name: Build distributions
        run: uv build

      - name: Check wheel type information
        run: |
          uv venv /tmp/marklassian-wheel-check --python "3.14"
          uv pip install --python /tmp/marklassian-wheel-check/bin/python dist/*.whl
          uv run --no-sync --python "3.14" mypy --strict \
            --python-executable /tmp/marklassian-wheel-check/bin/python \
            tests/typing/installed_package.py
